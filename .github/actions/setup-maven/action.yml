name: 'Maven Setup'
description: 'Sets up JDK and configures ~/.m2/settings.xml with Nexus credentials'

inputs:
  java-version:
    description: 'Java JDK Version'
    required: false
    default: '21'
  java-distribution:
    description: 'Java Distribution'
    required: false
    default: 'temurin'
  nexus-username:
    description: 'Nexus Username'
    required: false
  nexus-password:
    description: 'Nexus Password'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: maven

    - name: Configure Maven settings.xml
      shell: bash
      env:
        NEXUS_USERNAME: ${{ inputs.nexus-username }}
        NEXUS_PASSWORD: ${{ inputs.nexus-password }}
      run: |
        mkdir -p ~/.m2
        cat << 'EOF' > ~/.m2/settings.xml
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                      https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>nexus-releases</id>
              <username>${env.NEXUS_USERNAME}</username>
              <password>${env.NEXUS_PASSWORD}</password>
            </server>
            <server>
              <id>nexus-snapshots</id>
              <username>${env.NEXUS_USERNAME}</username>
              <password>${env.NEXUS_PASSWORD}</password>
            </server>
          </servers>
          <mirrors>
            <mirror>
              <id>01-nexus-mirror-maven-central</id>
              <mirrorOf>external:*,!nexus-releases,!nexus-snapshots</mirrorOf>
              <url>https://nexus.oberon-oss.eu/repository/maven-central/</url>
            </mirror>
          </mirrors>
        </settings>
        EOF