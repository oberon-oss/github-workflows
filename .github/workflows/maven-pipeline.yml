name: Shared Maven CI/CD Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '25'
      distribution:
        required: false
        type: string
        default: 'temurin'
      server-id:
        required: false
        type: string
        default: 'nexus-repository'
    secrets:
      SONAR_TOKEN:
        description: 'Token for SonarCloud analysis'
        required: false
      NEXUS_USERNAME:
        description: 'Nexus repository username'
        required: true
      NEXUS_PASSWORD:
        description: 'Nexus repository password'
        required: true

jobs:
  compile:
    name: 1. Compile Sources & Tests
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.eval-deploy.outputs.is_release }}
      release_version: ${{ steps.eval-deploy.outputs.release_version }}
      is_snapshot: ${{ steps.eval-deploy.outputs.is_snapshot }}
      snapshot_version: ${{ steps.eval-deploy.outputs.snapshot_version }}
      should_deploy: ${{ steps.eval-deploy.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: oberon-oss/github-workflows/.github/actions/setup-maven@923330280520e84964ba96bdf00bac952694a1fc
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}

      - name: Evaluate Deployment Target
        id: eval-deploy
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
              TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              TAG="${{ github.ref_name }}"
          fi

          IS_RELEASE="false"
          RELEASE_VERSION=""
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IS_RELEASE="true"
              RELEASE_VERSION="${TAG#v}"
          fi

          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -n 1)
          IS_SNAPSHOT="false"
          SNAPSHOT_VERSION=""
          if [ "$IS_RELEASE" = "false" ]; then
              if [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
                  IS_SNAPSHOT="true"
                  SNAPSHOT_VERSION="$PROJECT_VERSION"
              fi
          fi

          SHOULD_DEPLOY="false"
          if [ "$IS_RELEASE" = "true" ] || [ "$IS_SNAPSHOT" = "true" ]; then
              SHOULD_DEPLOY="true"
          fi

          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$IS_SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "snapshot_version=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Compile Main & Test Code
        run: mvn clean test-compile -DskipTests=true

  test-and-sonar:
    name: 2. Test, Coverage & SonarCloud
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oberon-oss/github-workflows/.github/actions/setup-maven@923330280520e84964ba96bdf00bac952694a1fc
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}

      - name: Run Tests (Release Tag)
        if: needs.compile.outputs.is_release == 'true'
        run: mvn test

      - name: Run Tests, JaCoCo and SonarCloud (Branch / Snapshot)
        if: needs.compile.outputs.is_release != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn test jacoco:report org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

  deploy:
    name: 3. Deploy to Nexus Repository
    needs: [compile, test-and-sonar]
    if: |
      always() &&
      !cancelled() &&
      needs.compile.result == 'success' &&
      needs.compile.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oberon-oss/github-workflows/.github/actions/setup-maven@923330280520e84964ba96bdf00bac952694a1fc
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          server-id: ${{ inputs.server-id }}
          server-username: ${{ secrets.NEXUS_USERNAME }}
          server-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Validate Release Quality Gate
        if: needs.compile.outputs.is_release == 'true' && needs.test-and-sonar.result != 'success'
        run: |
          echo "::error::Release deployment blocked because test-and-sonar phase did not succeed (status: ${{ needs.test-and-sonar.result }})."
          exit 1

      - name: Publish Release to Nexus
        if: needs.compile.outputs.is_release == 'true' && needs.test-and-sonar.result == 'success'
        run: |
          mvn versions:set -DnewVersion="${{ needs.compile.outputs.release_version }}" -DgenerateBackupPoms=false
          mvn deploy -Pgenerate-javadoc-and-source,activate-oberon-nexus -DskipTests=true

      - name: Publish Snapshot to Nexus
        if: needs.compile.outputs.is_snapshot == 'true'
        run: |
          mvn versions:set -DnewVersion="${{ needs.compile.outputs.snapshot_version }}" -DgenerateBackupPoms=false
          mvn deploy -Pgenerate-javadoc-and-source,activate-oberon-nexus -DskipTests=true

  deploy-site:
    name: 4. Deploy Site to GitHub Pages
    needs: [compile, test-and-sonar, deploy]
    if: |
      always() &&
      !cancelled() &&
      needs.compile.result == 'success' &&
      needs.test-and-sonar.result == 'success' &&
      needs.deploy.result == 'success' &&
      needs.compile.outputs.is_release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oberon-oss/github-workflows/.github/actions/setup-maven@923330280520e84964ba96bdf00bac952694a1fc
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}

      - name: Generate Maven Site
        run: |
          mvn versions:set -DnewVersion="${{ needs.compile.outputs.release_version }}" -DgenerateBackupPoms=false
          mvn clean site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4