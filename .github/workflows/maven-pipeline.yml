name: Shared Maven CI/CD Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to use'
        required: false
        default: '21'
        type: string
      java-distribution:
        description: 'JDK distribution'
        required: false
        default: 'temurin'
        type: string
      profiles:
        description: 'Maven profiles for build and tests'
        required: false
        default: 'lombok,jacoco'
        type: string
      deploy-target:
        description: 'Target repository for release deployment (nexus, central, both, none)'
        required: false
        default: 'nexus'
        type: string
      deploy-profiles:
        description: 'Maven profiles for Nexus deployment'
        required: false
        default: 'lombok,deploy-to-nexus'
        type: string
      deploy-central-profiles:
        description: 'Maven profiles for Maven Central deployment'
        required: false
        default: 'lombok,deploy-to-maven-central'
        type: string
      site-profiles:
        description: 'Maven profiles for site generation'
        required: false
        default: 'site'
        type: string
      sonar-qualitygate-wait:
        description: 'Whether to wait for Sonar Quality Gate'
        required: false
        default: true
        type: boolean
      cancel-in-progress:
        description: 'Whether to cancel in-progress runs for non-main branches'
        required: false
        default: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud authentication token'
        required: false
      NEXUS_USERNAME:
        description: 'Nexus repository username'
        required: false
      NEXUS_PASSWORD:
        description: 'Nexus repository password'
        required: false
      CENTRAL_USERNAME:
        description: 'Maven Central username / token username'
        required: false
      CENTRAL_PASSWORD:
        description: 'Maven Central password / token password'
        required: false
      GPG_PRIVATE_KEY:
        description: 'GPG private key for signing artifacts'
        required: false
      GPG_PASSPHRASE:
        description: 'GPG passphrase for signing artifacts'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ inputs.cancel-in-progress && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@5f526afb7d40767a353038d60a0e6d0dded3218d
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Extract Project Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r' | tail -n 1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compile and Test
        run: mvn clean test -P ${{ inputs.profiles }}

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
    outputs:
      version: ${{ steps.version.outputs.version }}

  sonar-qa:
    name: Sonar QA Analysis
    needs: build-and-test
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@5f526afb7d40767a353038d60a0e6d0dded3218d
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn sonar:sonar
          -P ${{ inputs.profiles }}
          -Dsonar.qualitygate.wait=${{ inputs.sonar-qualitygate-wait }}

  deploy-snapshot:
    name: Deploy Snapshot
    needs: build-and-test
    if: |
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      endsWith(needs.build-and-test.outputs.version, '-SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@5f526afb7d40767a353038d60a0e6d0dded3218d
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Deploy Snapshot Artifacts
        run: mvn deploy -DskipTests -P ${{ inputs.deploy-profiles }}

  deploy-release-nexus:
    name: Deploy Release (Nexus)
    needs: [ build-and-test, sonar-qa ]
    if: |
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      !endsWith(needs.build-and-test.outputs.version, '-SNAPSHOT') &&
      (inputs.deploy-target == 'nexus' || inputs.deploy-target == 'both')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@5f526afb7d40767a353038d60a0e6d0dded3218d
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Deploy Release Artifacts to Nexus
        run: mvn deploy -DskipTests -P ${{ inputs.deploy-profiles }}

  deploy-release-central:
    name: Deploy Release (Maven Central)
    needs: [ build-and-test, sonar-qa ]
    if: |
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      !endsWith(needs.build-and-test.outputs.version, '-SNAPSHOT') &&
      (inputs.deploy-target == 'central' || inputs.deploy-target == 'both')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@5f526afb7d40767a353038d60a0e6d0dded3218d
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy Release Artifacts to Maven Central
        run: mvn deploy -DskipTests -P ${{ inputs.deploy-central-profiles }}

  deploy-site:
    name: Deploy Documentation Site
    needs: [ build-and-test, sonar-qa ]
    if: |
      (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      !endsWith(needs.build-and-test.outputs.version, '-SNAPSHOT')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@5f526afb7d40767a353038d60a0e6d0dded3218d
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Generate Maven Site
        run: mvn clean site -P ${{ inputs.site-profiles }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4