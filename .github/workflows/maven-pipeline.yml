name: Shared Maven CI/CD Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to use'
        required: false
        default: '21'
        type: string
      java-distribution:
        description: 'JDK distribution'
        required: false
        default: 'temurin'
        type: string
      profiles:
        description: 'Maven profiles for build and tests'
        required: false
        default: 'lombok,jacoco'
        type: string
      deploy-profiles:
        description: 'Maven profiles for deployment'
        required: false
        default: 'lombok,activate-oberon-nexus'
        type: string
      sonar-qualitygate-wait:
        description: 'Whether to wait for Sonar Quality Gate'
        required: false
        default: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud authentication token'
        required: false
      NEXUS_USERNAME:
        description: 'Nexus repository username'
        required: false
      NEXUS_PASSWORD:
        description: 'Nexus repository password'
        required: false

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@3b8a8bab1edb4ee790b03ada7712103b8aab7f2d # v2.0.3
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Extract Project Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compile and Test
        run: mvn clean test -P ${{ inputs.profiles }}

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
    outputs:
      version: ${{ steps.version.outputs.version }}

  sonar-qa:
    name: Sonar QA Analysis
    needs: build-and-test
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@3b8a8bab1edb4ee790b03ada7712103b8aab7f2d # v2.0.3
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn sonar:sonar
          -P ${{ inputs.profiles }}
          -Dsonar.qualitygate.wait=${{ inputs.sonar-qualitygate-wait }}

  deploy-snapshot:
    name: Deploy Snapshot
    needs: build-and-test
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      endsWith(needs.build-and-test.outputs.version, '-SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@3b8a8bab1edb4ee790b03ada7712103b8aab7f2d # v2.0.3
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Deploy Snapshot Artifacts
        run: mvn deploy -DskipTests -P ${{ inputs.deploy-profiles }}

  deploy-release:
    name: Deploy Release
    needs: [build-and-test, sonar-qa]
    if: |
      github.event_name == 'release' &&
      !endsWith(needs.build-and-test.outputs.version, '-SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK and Maven Settings
        uses: oberon-oss/github-workflows/.github/actions/setup-maven@3b8a8bab1edb4ee790b03ada7712103b8aab7f2d # v2.0.3
        with:
          java-version: ${{ inputs.java-version }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Deploy Release Artifacts
        run: mvn deploy -DskipTests -P ${{ inputs.deploy-profiles }}